<!DOCTYPE html>
<html>
<head>
    <title>3D Rotating Car Animation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// ========================================
// 1. SCENE SETUP
// ========================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb8dce8);

const camera = new THREE.PerspectiveCamera(
    60, window.innerWidth / window.innerHeight, 0.1, 1000
);

camera.position.set(6, 5, 8);
camera.lookAt(0, 0.5, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// ========================================
// 2. LIGHTING
// ========================================

scene.add(new THREE.AmbientLight(0xffffff, 1.2));

const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(5, 10, 5);
light.castShadow = true;
scene.add(light);

// ========================================
// 3. MATERIALS
// ========================================

const carMaterial = new THREE.MeshStandardMaterial({
    color: 0xe63946,
    roughness: 0.5
});

const glassMaterial = new THREE.MeshStandardMaterial({
    color: 0x87ceeb,
    metalness: 0.2,
    roughness: 0.2
});

const blackMaterial = new THREE.MeshStandardMaterial({
    color: 0x222222
});

const silverMaterial = new THREE.MeshStandardMaterial({
    color: 0xcccccc,
    metalness: 0.7
});

const lightMaterial = new THREE.MeshStandardMaterial({
    color: 0xffffcc
});

// ========================================
// 4. HELPER FUNCTION
// ========================================

function box(parent, x, y, z, sx, sy, sz, material) {

    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(sx, sy, sz),
        material
    );

    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    parent.add(mesh);

    return mesh;
}

// ========================================
// 5. CREATE THE CAR
// ========================================

const car = new THREE.Group();
scene.add(car);

// Main body
box(car, 0, 0.6, 0, 3, 0.7, 1.4, carMaterial);

// Top cabin
box(car, 0, 1.2, 0, 1.6, 0.8, 1.2, carMaterial);

// Front windshield
box(car, 0.82, 1.25, 0, 0.08, 0.55, 1.05, glassMaterial);

// Side windows
box(car, 0, 1.25, 0.61, 1.3, 0.5, 0.04, glassMaterial);
box(car, 0, 1.25, -0.61, 1.3, 0.5, 0.04, glassMaterial);

// Headlights
box(car, 1.51, 0.7, 0.45, 0.08, 0.2, 0.25, lightMaterial);
box(car, 1.51, 0.7, -0.45, 0.08, 0.2, 0.25, lightMaterial);

// Rear lights
box(car, -1.51, 0.7, 0.45, 0.08, 0.2, 0.25, new THREE.MeshStandardMaterial({color:0xff0000}));
box(car, -1.51, 0.7, -0.45, 0.08, 0.2, 0.25, new THREE.MeshStandardMaterial({color:0xff0000}));

// ========================================
// 6. CREATE THE WHEELS
// ========================================

const wheels = [];

function createWheel(x, z) {

    const wheel = new THREE.Group();

    const tyre = new THREE.Mesh(
        new THREE.CylinderGeometry(0.42, 0.42, 0.25, 32),
        blackMaterial
    );

    tyre.rotation.x = Math.PI / 2;
    wheel.add(tyre);

    const rim = new THREE.Mesh(
        new THREE.CylinderGeometry(0.22, 0.22, 0.27, 32),
        silverMaterial
    );

    rim.rotation.x = Math.PI / 2;
    wheel.add(rim);

    wheel.position.set(x, 0.42, z);
    car.add(wheel);

    wheels.push(wheel);
}

createWheel(1, 0.75);
createWheel(-1, 0.75);
createWheel(1, -0.75);
createWheel(-1, -0.75);

// ========================================
// 7. GROUND
// ========================================

const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(30, 30),
    new THREE.MeshStandardMaterial({color:0x9acb91})
);

ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;

scene.add(ground);

// ========================================
// 8. ANIMATION
// ========================================

const clock = new THREE.Clock();

function animate() {

    requestAnimationFrame(animate);

    const time = clock.getElapsedTime();

    // Rotate the entire car
    car.rotation.y = time * 1.8;

    // Rotate the wheels
    // wheels.forEach((wheel) => {
    //  wheel.rotation.x = time * 3;
    //});

    renderer.render(scene, camera);
}

animate();

// ========================================
// 9. WINDOW RESIZE
// ========================================

window.addEventListener("resize", () => {

    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth, window.innerHeight);

});

</script>

</body>
</html>
